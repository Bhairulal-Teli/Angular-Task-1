<div class="backdrop" (click)="onCancelEditLog()"></div>
<dialog open>
  @if(log.hasError('required')) {
    <p>This field is required</p>
  }
  @if(log.hasError('invalidRoute')) {
    <p>Please enter a valid URL</p>
  }
  <h2>Edit Log</h2>
  <form (ngSubmit)="onSubmit()">
    <p>
      <label for="due-date">Log</label>
      <input required type="text" id="log" name="log" [formControl]="log" />
    </p>
    <p class="actions">
      <button type="button" (click)="onCancelEditLog()">Cancel</button>
      <button [disabled]="!isFormValid() || log.hasError('invalidRoute') || log.hasError('required')" type="submit">Edit</button>
    </p>
  </form>
</dialog>
